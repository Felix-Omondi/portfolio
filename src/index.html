<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Felix Omondi — Portfolio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Personal portfolio of Felix Omondi: experience, projects and contact details."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('theme-mode') || 'system';
          var dark =
            m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
